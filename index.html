<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#236653" />
    <meta
      name="description"
      content="Mini Library — Không gian đọc của bạn. Khám phá, mượn và quản lý sách chuyên ngành một cách đơn giản."
    />
    <title>Mini Library · Không gian đọc của bạn</title>
    <script>
      try {
        const mode = localStorage.getItem('mini-library-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
